; Interim mitigation for the 2026-10-21 PHP security release.
; session.upload_progress.enabled is INI_PERDIR, so ini_set() cannot change it;
; it must ship as a conf.d drop-in. The zz- prefix keeps this file last so it
; loads after php.ini and the docker-php-ext-*.ini files.
; Remove this file once the patched PHP 8.2 is picked up via the floating
; 8.2-fpm-alpine tag and a rebuild.
session.upload_progress.enabled = Off
